<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="premiumStrip">
    <div class="ns-backup-premium-strip d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div class="d-flex align-items-center gap-3">
            <span class="ns-backup-premium-strip__icon"><core:icon identifier="actions-rocket" size="small" /></span>
            <div>
                <div class="ns-backup-premium-strip__headline"><f:translate key="premium.strip.headline" /></div>
                <div class="ns-backup-premium-strip__description"><f:translate key="premium.strip.description" /></div>
            </div>
        </div>
        <a href="{trialUrl}" class="btn btn-primary d-inline-flex align-items-center gap-2">
            <f:translate key="premium.strip.trial" />
            <core:icon identifier="actions-arrow-right" size="small" />
        </a>
    </div>
</f:section>

<f:section name="content">
    <f:flashMessages />
	<div class="ns-backup-dashboard-blocks">
		<div class="row">
            <div class="col-md-6">
				<div class="ns-backup-last-logs">
					<div class="custom-card card" data-mh="ns-backup-dashboard-block">
						<div class="card-header">
							<h5><f:translate key="logs" /></h5>
						</div>
						<div class="card-body">
							<ul class="list-unstyled">
                                <f:if condition="{arrBackupData}">
                                    <f:then>
                                        <f:for each="{arrBackupData}" as="backup" iteration="i">
                                            <li>
                                                {backup.title}:
                                                <f:for each="{backuptype}" as="whichbackup" iteration="i">
                                                    <f:if condition="{whichbackup.value} == {backup.backup_type}">
                                                        {whichbackup.key}
                                                    </f:if>
                                                </f:for>
                                                at <f:format.date format="d-m-Y H:i">{backup.start_datetime}</f:format.date>
                                            </li>
                                        </f:for>
                                        <f:link.action action="backuprestore" controller="Backups" class="btn btn-secondary"><em class="fa fa-file-text-o" aria-hidden="true"></em> <f:translate key="more.logs" /></f:link.action>
                                    </f:then>
                                    <f:else>
                                        <f:translate key="no.data.found" />
                                    </f:else>
                                </f:if>
							</ul>
						</div>
					</div>
				</div>
			</div>
			<div class="col-md-6">
				<div class="ns-backup-backupnow">
					<div class="card custom-card" data-mh="ns-backup-dashboard-block">
						<div class="card-header">
							<h5><f:translate key="backup.now" /></h5>
						</div>
						<div class="card-body">
							<p>
                                <f:translate key="backup.now.description1" />
                                <f:translate key="backup.now.description2" />
                            </p>
							<button type="button" class="btn btn-secondary js-open-backup-now-modal" {modalAttr}target="#backupNowModal">
							   <em class="fa fa-cloud-download" aria-hidden="true"></em><f:translate key="start.one.click.backup" />
							</button>
                            <p>&nbsp;</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</f:section>
</html>
